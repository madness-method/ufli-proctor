<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UFLI Foundations Proctor</title>
  <!-- © copyright 2025 Kevin Thackorie. See 'LICENSE.md' file for details. -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>UFLI Procter</h1>

  <!-- Initial 4 input boxes + Submit button -->
  <div id="initial-inputs">
    <input
      type="text"
      id="alphaInput"
      class="regular-input"
      pattern="[A-Za-z]+"
      class="regular-input"
      required
    />
    <span>change the </span>
    <input
      type="text"
      id="change-one"
      pattern="[A-Za-z]+"
      class="stubby-input"
      required
    />
    <span>to a </span>
    <input
      type="text"
      id="change-two"
      pattern="[A-Za-z]+"
      class="stubby-input"
      required
    />
    <span>&rarr;</span>
    <input
      type="text"
      id="bravoInput"
      class="regular-input"
      pattern="[A-Za-z]+"
      required
    />
    <span>&rarr;</span>
    <input
      type="text"
      id="charlieInput"
      class="regular-input"
      pattern="[A-Za-z]+"
      required
    />
    <span>change the </span>
    <input
      type="text"
      id="change-three"
      pattern="[A-Za-z]+"
      class="stubby-input"
      required
    />
    <span>to a </span>
    <input
      type="text"
      id="change-four"
      pattern="[A-Za-z]+"
      class="stubby-input"
      required
    />
    <span>&rarr;</span>
    <input
      type="text"
      id="deltaInput"
      class="regular-input"
      pattern="[A-Za-z]+"
      required
    />
    <br />
    <button id="submitWords">Submit</button>
  </div>

  <!-- Activity section (hidden by default) -->
  <div id="activity" style="display: none;">

    <!-- Word chain -->
    <div id="word-chain-container">
      <span id="word-chain-1" class="word-chain-word">&nbsp;</span>
      <span class="word-chain-arrow">&rarr;</span>
      <span id="word-chain-2" class="word-chain-word">&nbsp;</span>
      <span class="word-chain-arrow">&rarr;</span>
      <span id="word-chain-3" class="word-chain-word">&nbsp;</span>
      <span class="word-chain-arrow">&rarr;</span>
      <span id="word-chain-4" class="word-chain-word">&nbsp;</span>
    </div>

    <!-- ALPHA2 -->
    <div id="alpha2Container" class="word-container" style="display: none;">
      <button class="playBtn" data-word="alpha" id="play-alpha2">Play</button><br />
      <input
        type="text"
        id="alpha2Input"
        pattern="[A-Za-z]+"
      />
      <button class="submitBtn" data-word="alpha">Check</button>
      <span class="checkmark" id="alpha2Checkmark" style="display: none;">✔</span>
    </div>

    <!-- BRAVO2 -->
    <div id="bravo2Container" class="word-container" style="display: none;">
      <button class="playBtn" data-word="bravo" id="play-bravo2">Play</button><br />
      <input
        type="text"
        id="bravo2Input"
        pattern="[A-Za-z]+"
      />
      <button class="submitBtn" data-word="bravo">Check</button>
      <span class="checkmark" id="bravo2Checkmark" style="display: none;">✔</span>
    </div>

    <!-- CHARLIE2 -->
    <div id="charlie2Container" class="word-container" style="display: none;">
      <button class="playBtn" data-word="charlie" id="play-charlie2">Play</button><br />
      <input
        type="text"
        id="charlie2Input"
        pattern="[A-Za-z]+"
      />
      <button class="submitBtn" data-word="charlie">Check</button>
      <span class="checkmark" id="charlie2Checkmark" style="display: none;">✔</span>
    </div>

    <!-- DELTA2 -->
    <div id="delta2Container" class="word-container" style="display: none;">
      <button class="playBtn" data-word="delta" id="play-delta2">Play</button><br />
      <input
        type="text"
        id="delta2Input"
        pattern="[A-Za-z]+"
      />
      <button class="submitBtn" data-word="delta">Check</button>
      <span class="checkmark" id="delta2Checkmark" style="display: none;">✔</span>
    </div>

    <div id="message">Great job!</div>
  </div>

  <script src="js/main.js" defer></script>
</body>
</html>
